    }
    e.speed = damp(e.speed, sp, 10, dt);

    {
        const y0 = obj.position.y + 0.3, y1 = obj.position.y + 1.65;
        if (blocked(obj.position.x, obj.position.z, y0, y1, 0.42)) {
            depenetrate(obj.position, 0.42, y0, y1);
            if (blocked(obj.position.x, obj.position.z, y0, y1, 0.42)) {
                const f = nearestFree(obj.position.x, obj.position.z, 0.5, 1.7, 8, obj.position.y);
                obj.position.x = f[0];
                obj.position.z = f[1];
                e.avoidT = 0;
                e.avoidSide = 0;
                e.clearT = 0;
                e.cover = null;
            }
        }
    }

    e.stuckT += dt;
    if (e.stuckT >= 0.6) {
        const moved = Math.hypot(obj.position.x - e.stuckX, obj.position.z - e.stuckZ);
        if (sp > 0.2 && moved < 0.22) {
            if (++e.stuckN >= 2) {
                e.stuckN = 0;
                e.avoidSide = 0;
                e.avoidT = 0;
                e.clearT = 0;
                if (e.state === ST.PATROL) {
                    e.wp = (e.wp + 1) % e.route.length;
                    e.idleT = 0;
                } else {
                    const f = nearestFree(obj.position.x + rand(-5, 5), obj.position.z + rand(-5, 5),
                        0.5, 1.7, 6, obj.position.y);
                    e.lastKnown.set(f[0], obj.position.y, f[1]);
                    e.cover = null;
                }
            }
        } else e.stuckN = 0;
        e.stuckT = 0;
        e.stuckX = obj.position.x;
        e.stuckZ = obj.position.z;
    }

    const gy = groundAt(obj.position.x, obj.position.z, obj.position.y + 0.75);
    if (gy !== null) {
        if (obj.position.y > gy + 0.05) obj.position.y = Math.max(gy, obj.position.y - 12 * dt);
        else obj.position.y = gy;
    } else obj.position.y = Math.max(0, obj.position.y - 12 * dt);

    // ============ 转向 ============
    let dy = e.targetYaw - e.yaw;
    while (dy > PI) dy -= PI * 2;
    while (dy < -PI) dy += PI * 2;
    e.yaw += dy * Math.min(1, dt * (e.state === ST.COMBAT ? 9 : 4.2));
    obj.rotation.y = e.yaw;

    // ============ 动画 ============
    if (animate) {
        const walk = clamp(e.speed / 2.4, 0, 1);
        e.walkPhase += dt * (2.5 + e.speed * 1.3);
        const s1 = Math.sin(e.walkPhase), c1 = Math.cos(e.walkPhase);
        p.legs[0].hip.rotation.x = s1 * 0.62 * walk;
        p.legs[1].hip.rotation.x = -s1 * 0.62 * walk;
        p.legs[0].knee.rotation.x = Math.max(0, -Math.cos(e.walkPhase)) * 0.7 * walk;
        p.legs[1].knee.rotation.x = Math.max(0, Math.cos(e.walkPhase)) * 0.7 * walk;
        p.body.position.y = Math.abs(c1) * 0.045 * walk - e.flinch * 0.03;
        p.body.rotation.z = s1 * 0.035 * walk;
        const combat = e.state === ST.COMBAT || e.state === ST.ALERT ? 1 : 0;
        e.combatBlend = damp(e.combatBlend === undefined ? 0 : e.combatBlend, combat, 7, dt);
        const cb = e.combatBlend;
        p.arms[0].sh.rotation.x = lerp(0.85 + s1 * 0.25 * walk, 1.5, cb);
        p.arms[1].sh.rotation.x = lerp(1.12 - s1 * 0.25 * walk, 1.99, cb);
        p.gun.position.set(lerp(0.14, 0.1, cb), lerp(-0.3, -0.05, cb), lerp(-0.2, -0.26, cb));
        p.gun.rotation.set(lerp(-0.42, 0, cb), lerp(-0.16, 0, cb), lerp(0.2, 0, cb));
        p.rig.rotation.x = lerp(0, e.aimPitch, cb);
        p.head.rotation.x = lerp(0, e.aimPitch * 0.5, cb);
        p.model.position.z = e.flinch * 0.14;
        p.model.rotation.x = e.flinch * 0.2;
        const dCam = obj.position.distanceTo(camera.position);
        e.tag.sprite.visible = G.started && dCam < 46;
        if (e.tag.sprite.visible) {
            const s = clamp(dCam * 0.055, 0.85, 2.4) * (camera.fov / BASE_FOV);
            e.tag.sprite.scale.set(1.55 * s, 0.46 * s, 1);
            e.tag.sprite.position.y = 2.16;
        }
    }

    // ★ 把最终物理位置写回 physPos，供下一物理帧和渲染插值使用
    e.physPos.copy(obj.position);
}

function findMantle() {
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
    const feet = player.pos.y;

    // 在前方几个距离上采样
    for (let i = 0; i < 5; i++) {
        const reach = 0.45 + i * 0.18;
        const px = player.pos.x + fx * reach;
        const pz = player.pos.z + fz * reach;

        // ★ 只要前方这点有地面（任意高度），就认为可爬
        //   从很高处往下打，找这一点最高的可站立面
        const standY = groundAt(px, pz, feet + 60.0);
        if (standY === null) continue;

        // 目标必须比脚高（否则不是攀爬，是走路）
        if (standY - feet < 0.2) continue;

        // ★ 头顶 0.2m 以内有天花板 → 不行
        const ceil = ceilingAt(px, pz, standY + STAND_H);
        if (ceil - standY < 0.2) continue;

        return _mtA.set(
            player.pos.x + fx * (reach + 0.25),
            standY + 0.02,
            player.pos.z + fz * (reach + 0.25)
        );
    }
    return null;
}
function startMantle(target) {

const PHYS_MS = FIXED_DT * 1000;
let physOn = true;
let physNext = performance.now() + PHYS_MS;

function physicsLoop() {
    if (!physOn) return;

    const now = performance.now();

    // ★ 关键：不在游戏中 → 不跑物理、不累积时间、重置基准
    if (!G.running || G.over) {
        physNext = now + PHYS_MS;
        setTimeout(physicsLoop, PHYS_MS);
        return;
    }

    let steps = 0;
    while (now >= physNext && steps < 3) {
        lastPhysTick = performance.now();
        simulationStep();
        physNext += PHYS_MS;
        steps++;
    }
    if (steps === 3) physNext = performance.now() + PHYS_MS;

    setTimeout(physicsLoop, Math.max(0, physNext - performance.now()));
}

            for (let r = row; r < row + h; r++)
                for (let c = col; c < col + w; c++) {
                    const cell = this.grid[r][c];
                    if (cell && cell.uid !== ignoreUid) return false;
                }
            return true;
        },
        place(item, col, row) {
            const w = item.w, h = item.h;
            if (!this.canPlace(col, row, w, h, item.uid)) return false;
            this.remove(item.uid);
            item.col = col; item.row = row;
            for (let r = row; r < row + h; r++)
                for (let c = col; c < col + w; c++) this.grid[r][c] = item;
            if (!this.items.includes(item)) this.items.push(item);
            return true;
        },
        remove(uid) {
            for (let r = 0; r < this.ROWS; r++)
                for (let c = 0; c < this.COLS; c++)
                    if (this.grid[r][c] && this.grid[r][c].uid === uid)
                        this.grid[r][c] = null;
            this.items = this.items.filter((it) => it.uid !== uid);
        },
        get(uid) { return this.items.find((it) => it.uid === uid) || null; },
        usedCells() {
            let n = 0;
            for (const it of this.items) n += it.w * it.h;
            return n;
        },
        clear() { this.init(); },
    };
    inv.init();
    return inv;
}

function spawnLootBox(x, z) {
    const cfg = { file: LOOT_BOX_MODEL_FILE, scale: 1, rotX: 0, rotY: 0, rotZ: 0 };
    const src = GUN_MODEL_CACHE[cfg.file];
    const group = new THREE.Group();

    if (src) {
        const model = SkeletonUtils.clone(src);
        model.scale.setScalar(cfg.scale);
        model.traverse(o => {
            if (o.isMesh) {
                o.castShadow = true;
                o.receiveShadow = true;
                o.userData.skipTexelize = true;
                if (o.geometry) o.geometry.userData.uvScaled = true;
            }
        });
        group.add(model);
    } else {
        // 兜底：一个简单的盒子
        const box = new THREE.Mesh(
            new THREE.BoxGeometry(0.9, 0.6, 0.6),
            new THREE.MeshStandardMaterial({ color: 0x4a5a3a, roughness: 0.8, metalness: 0.15 })
        );
        group.add(box);
    }

    const gy = groundAt(x, z, 2.0);
    group.position.set(x, (gy === null ? 0 : gy) + 0.05, z);
    group.rotation.y = rand(0, PI * 2);
    scene.add(group);
    worldSolid.push(group);

    // 用内联 inventory
    const inv = makeContainerInv();
    fillLootBox(inv);

    const loot = {
        group,
        x, z,
        y: group.position.y,
        inv,
        opened: false,
    };
    LOOT_BOXES.push(loot);
    return loot;
}

function fillLootBox(inv) {
    // 随机塞 2~5 件武器/物资
    const pool = [
        "rifle", "ak", "scar", "shotgun", "pistol", "sniper",
        "medkit", "energy", "grenade", "knife",
    ];
    const n = randI(2, 5);
    for (let i = 0; i < n; i++) {
        const id = pick(pool);
        const w0 = WEAPON_BY_ID[id];
        if (!w0) continue;
        const sz = itemSizeOf(id);
        const item = {
            uid: _uidCounter++,
            id,
            name: w0.name,
            rare: !!w0.rare,
            isGrenade: id === GRENADE_ID,
            count: id === GRENADE_ID ? 1 : undefined,
            col: 0, row: 0, w: sz[0], h: sz[1],
        };
        // 找空位
        let placed = false;
        for (let r = 0; r < inv.ROWS && !placed; r++)
            for (let c = 0; c < inv.COLS && !placed; c++)
                if (inv.canPlace(c, r, item.w, item.h)) {
                    inv.place(item, c, r);
                    placed = true;
                }
        if (!placed) break;
    }
}

        document.querySelectorAll(".packSlotItem").forEach(n => (n.style.opacity = ""));
        return;
    }

    // ============ 情况 1b：从网格拖到网格（同容器 / 跨容器） ============
    let srcInv;
    if (dragState.kind === "loot") {
        srcInv = LOOTUI._box ? LOOTUI._box.inv : null;
    } else if (dragState.kind === "pack") {
        srcInv = PACK;
    } else {
        cancelDrag(); return;
    }
    if (!srcInv) { cancelDrag(); return; }

    const srcItem = srcInv.get(dragState.uid);
    if (!srcItem) { cancelDrag(); return; }

    if (srcInv === target.inv) {
        // 同容器内挪位置
        target.inv.place(srcItem, col, row);
    } else {
        // 跨容器：新物品用新 uid，避免冲突
        const newItem = {
            ...srcItem,
            uid: _uidCounter++,
            col: 0, row: 0,
        };
        if (!target.inv.canPlace(col, row, newItem.w, newItem.h)) {
            cancelDrag(); return;
        }
        srcInv.remove(srcItem.uid);
        target.inv.place(newItem, col, row);
    }

    LOOTUI.refresh && LOOTUI.open && LOOTUI.refresh();
    PACKUI.refresh();
    PACKUI.updateBadge();
    dragState = null;
    hideGhost();
    document.querySelectorAll(".packItem.dragging").forEach(n => n.classList.remove("dragging"));
    document.querySelectorAll(".packSlotItem").forEach(n => (n.style.opacity = ""));
}

        function cancelDrag() {
            document.querySelectorAll(".packSlotItem").forEach((n) => (n.style.opacity = ""));
            document.querySelectorAll(".packItem.dragging").forEach((n) => n.classList.remove("dragging"));
            PACKUI.grid.querySelectorAll(".packCell.hover-ok, .packCell.hover-bad")
                .forEach((n) => n.classList.remove("hover-ok", "hover-bad"));
            dragState = null;
            hideGhost();
        }

        function removeFromCarried(uid) {
            const idx = G.carriedInstances.findIndex((i) => i.uid === uid);
            if (idx < 0) return;
            const wasActive = idx === G.carriedIndex;
            G.carried.splice(idx, 1);
            G.carriedInstances.splice(idx, 1);
        
            // ★ 删掉 if (G.carried.length === 0) { ... } 整段
        
            if (G.carriedIndex >= G.carried.length)
                G.carriedIndex = Math.max(0, G.carried.length - 1);
            else if (wasActive && G.carriedIndex > idx) G.carriedIndex--;
        
            for (const id of Object.keys(WEAPON_BY_ID)) {
                const w = WEAPON_BY_ID[id];
                if (w.vm) w.vm.group.visible = false;
            }
            // ★ 空手时 currentWeapon() 会 fallback 到 knife，但 carriedInstances 里没有它
            //    所以要加个保护：只有 carried 非空时才切 VM
            if (G.carried.length > 0) {
                const cur = currentWeapon();
                if (cur.vm) cur.vm.group.visible = true;
            }
            rebuildSlots();
            updateAmmoUI();
        }

        function movePackItemToCarried(uid) {
            const item = PACK.get(uid);
            if (!item) return false;
            if (G.carried.length >= 5) {
                pushComms("背包", "手持槽位已满");
                return false;
            }
            const inst = {
                uid: item.uid, id: item.id, name: item.name,
                rare: item.rare,
                isGrenade: item.isGrenade, count: item.count,
            };
            G.carried.push(item.id);
            G.carriedInstances.push(inst);
            PACK.remove(uid);
            rebuildSlots();
            updateAmmoUI();
            PACKUI.refreshSide();
            PACKUI.refresh();
            PACKUI.updateBadge();
            return true;
        }

        function dropPackItemToGround(uid) {
            const item = PACK.get(uid);
            if (!item) return;
            const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
            const gx = player.pos.x + fx * 1.0;
            const gz = player.pos.z + fz * 1.0;
            const gy = groundAt(gx, gz, player.pos.y + 0.5);
            dropWeaponAt(item.id, new THREE.Vector3(gx, (gy === null ? 0 : gy) + 0.15, gz), player.yaw + rand(-0.4, 0.4));
            PACK.remove(uid);
            PACKUI.refresh();
            PACKUI.updateBadge();
            SFX.magOut();
        }

        function bindPackEvents() {
    const btnPack = document.getElementById("btnPack");
    const packClose = document.getElementById("packCloseBtn");

    const togglePack = (e) => {
        if (e) e.stopPropagation();
        if (PACKUI.open) PACKUI.closePack();
        else PACKUI.openPack();
    };
    btnPack.addEventListener("click", togglePack);
    btnPack.addEventListener("touchstart", (e) => {
        e.preventDefault(); e.stopPropagation();
        togglePack();
    }, { passive: false });

    packClose.addEventListener("click", (e) => { e.stopPropagation(); PACKUI.closePack(); });
    packClose.addEventListener("touchstart", (e) => {
        e.preventDefault(); e.stopPropagation();
        PACKUI.closePack();
    }, { passive: false });

    const pointOf = (e) => {
        if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        return { x: e.clientX, y: e.clientY };
    };

    const startFromSlot = (clientX, clientY, target) => {
        const item = target.closest(".packSlotItem");
        if (!item || item.classList.contains("empty")) return;
        const idx = parseInt(item.dataset.slot, 10);
        const inst = G.carriedInstances[idx];
        if (!inst) return;
        
        const fakeEvt = { clientX, clientY };
        beginDragFromSlot(fakeEvt, inst, item);
    };

    const startFromPack = (clientX, clientY, target) => {
        const el = target.closest(".packItem");
        if (!el) return;
        const uid = parseInt(el.dataset.uid, 10);
        const item = PACK.get(uid);
        if (!item) return;
        const fakeEvt = { clientX, clientY };
        beginDragFromPack(fakeEvt, item, el);
    };

    PACKUI.side.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        startFromSlot(e.clientX, e.clientY, e.target);
    });
    PACKUI.side.addEventListener("touchstart", (e) => {
        e.preventDefault(); e.stopPropagation();
        const p = pointOf(e);
        startFromSlot(p.x, p.y, e.target);
    }, { passive: false });

    PACKUI.grid.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        startFromPack(e.clientX, e.clientY, e.target);
    });
    PACKUI.grid.addEventListener("touchstart", (e) => {
        e.preventDefault(); e.stopPropagation();
        const p = pointOf(e);
        startFromPack(p.x, p.y, e.target);
    }, { passive: false });

    PACKUI.grid.addEventListener("contextmenu", (e) => {
        const el = e.target.closest(".packItem");
        if (!el) return;
        e.preventDefault();
        const uid = parseInt(el.dataset.uid, 10);
        const item = PACK.get(uid);
        if (!item) return;
        if (!movePackItemToCarried(uid)) dropPackItemToGround(uid);
        else SFX.pickupClick();
    });

    let longPressTimer = null;
    let longPressMoved = false;
    PACKUI.grid.addEventListener("touchstart", (e) => {
        const el = e.target.closest(".packItem");
        if (!el) return;
        longPressMoved = false;
        const uid = parseInt(el.dataset.uid, 10);
        longPressTimer = setTimeout(() => {
            if (longPressMoved) return;
            const item = PACK.get(uid);
            if (!item) return;
            if (!movePackItemToCarried(uid)) dropPackItemToGround(uid);
            else SFX.pickupClick();
            longPressTimer = null;
        }, 500);
    }, { passive: true });
    PACKUI.grid.addEventListener("touchmove", () => { longPressMoved = true; }, { passive: true });
    PACKUI.grid.addEventListener("touchend", () => {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });
    PACKUI.grid.addEventListener("touchcancel", () => {
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });

    window.addEventListener("mousemove", (e) => {
        if (!dragState) return;
        moveGhost(e.clientX, e.clientY);
        hoverCellsAt(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", (e) => {
        if (!dragState) return;
        if (e.button !== 0) return;
        dropAt(e.clientX, e.clientY);
    });

    window.addEventListener("touchmove", (e) => {
        if (!dragState) return;
        e.preventDefault();
        const p = pointOf(e);
        moveGhost(p.x, p.y);
        hoverCellsAt(p.x, p.y);
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
        if (!dragState) return;
        const p = pointOf(e);
        dropAt(p.x, p.y);
    }, { passive: false });

    window.addEventListener("touchcancel", () => {
        if (dragState) cancelDrag();
    });
}

        function bindPackHotkeys() {
            window.addEventListener("keydown", (e) => {
                if (e.code === "Tab") {
                    e.preventDefault();
                    if (!G.started || G.over) return;
                    if (PACKUI.open) PACKUI.closePack();
                    else PACKUI.openPack();
                } else if (e.code === "Escape" && PACKUI.open) {
                    e.preventDefault();
                    PACKUI.closePack();
                }
            });
        }

        PACKUI.buildGrid();
        bindPackEvents();
        bindPackHotkeys();
        PACKUI.updateBadge();

        setupMission();
        setupBoat();
        
        loadHeightmap("models/textures/heightmap.png", () => {
            TEX_TERRAIN_ATLAS = makeTerrainAtlas(512);
            TEX_TERRAIN_NORMAL_ATLAS = makeTerrainNormalAtlas(512); // ★ 新增
            buildMountainRegion();
            buildFence();
            buildFenceColliders();
            buildBVHForWorld();
        });
        rebuildSlots();

        UI.slots.addEventListener("dblclick", (e) => {
            const el = e.target.closest(".slot");
            if (!el) return;
            e.preventDefault();
            e.stopPropagation();
            if (!G.running || G.over) return;
            const idx = parseInt(el.dataset.slot, 10);
            if (isNaN(idx)) return;
            dropSlotToGround(idx);
        });
        function dropSlotToGround(idx) {
            if (idx < 0 || idx >= G.carried.length) return;
            const id = G.carried[idx];
            const w = WEAPON_BY_ID[id];
            if (!w) return;
            
            const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
            const gx = player.pos.x + fx * 0.9;
            const gz = player.pos.z + fz * 0.9;
            const gy = groundAt(gx, gz, player.pos.y + 0.5);
            const dropPos = new THREE.Vector3(gx, (gy === null ? 0 : gy) + 0.15, gz);
            G.carried.splice(idx, 1);
            G.carriedInstances.splice(idx, 1);
            dropWeaponAt(id, dropPos, player.yaw + rand(-0.4, 0.4));
            if (DROPPED_WEAPONS.length) {
                const last = DROPPED_WEAPONS[DROPPED_WEAPONS.length - 1];
                last.pickupLock = 0.9;
            }
            if (G.carriedIndex >= G.carried.length) {
                G.carriedIndex = Math.max(0, G.carried.length - 1);
            }
            const newW = WEAPON_BY_ID[G.carried[G.carriedIndex]];
            if (newW && newW.vm) newW.vm.group.visible = true;
            rebuildSlots();
            updateAmmoUI();
            SFX.magOut();
        }
        updateVitalsUI();
        updateAmmoUI();
        layoutCrosshair();
        updateMenuWallet();
        // 在 preloadGunModels().then(...) 里，确保箱子模型已加载
        preloadGunModels().then(() => {
            buildAllWeaponVMs();
            spawnLootBoxesAroundMap(); // ← 加这行
            UI.boot.classList.add("hide");
            requestAnimationFrame(frame);
        });
        // ★ 一次性把所有关键变量挂到 window
        Object.assign(window, {
            // three
            THREE, scene, camera, renderer,
            vmScene, vmCamera, vmRoot, vmSway, vmRecoil, vmKnife,
            // 游戏对象
            player, enemies, G, UI, keys,
            // 武器
            WEAPONS, WEAPON_BY_ID, GUN_MODEL_CACHE, GUN_MODEL_CONFIG,
            KNIFE_ID, GRENADE_ID,
            // 函数
            currentWeapon, attachGunModelToHand, buildAllWeaponVMs,
            updateViewmodel, groundAt, blocked, nearestFree, ST,
            // 常量
            BASE_FOV, VM_FOV, VM_ADS_DOLLY, VM_SCALE,
            // 场景辅助
            sceneRT, vmAmb, vmKey, vmFill, vmRim,
        });
        
        requestAnimationFrame(frame);
    </script>
</body>
